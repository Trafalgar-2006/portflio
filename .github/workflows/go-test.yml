name: Go

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch: # lets you trigger a run by hand from the Actions tab

# Cancel an in-flight run when new commits land on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build, vet & race-test
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Read the version from go.mod so CI can't drift from local builds.
          go-version-file: go.mod
          cache: true # caches the module and build caches

      - name: Download dependencies
        run: go mod download

      - name: Verify go.mod / go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum \
            || { echo "::error::go.mod/go.sum are not tidy — run 'go mod tidy' and commit"; exit 1; }

      - name: gofmt
        run: |
          # Only the files this project actively formats; the older views files
          # use a deliberate compact style that gofmt would rewrite wholesale.
          unformatted=$(gofmt -l env.go main.go stats.go session.go guestbook.go \
            github_sync.go wakatime.go screensaver.go \
            views/fx.go views/fx_screen.go views/fx_text.go views/games.go \
            views/github.go views/guestbook.go views/admin.go views/neofetch.go \
            views/timeline.go views/content.go views/layout.go)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on:"; echo "$unformatted"; exit 1
          fi

      - name: Build
        run: go build -v ./...

      - name: go vet
        run: go vet ./...

      # The main event. ubuntu-latest ships GCC, so cgo — and therefore the
      # race detector — works here even though it can't run on the Windows
      # dev machine without a C toolchain.
      - name: Race-detector test
        env:
          CGO_ENABLED: 1
        run: go test ./... -race -count=1 -timeout 10m

      - name: Confirm the race detector was actually active
        env:
          CGO_ENABLED: 1
        run: |
          # A guard against silently losing race coverage: if cgo were
          # disabled, `go test -race` would fail to build rather than pass
          # quietly, but this makes the state explicit in the log.
          echo "CGO_ENABLED=$(go env CGO_ENABLED)"
          go env CGO_ENABLED | grep -q '^1$' \
            || { echo "::error::cgo is off — the race detector did not run"; exit 1; }

  build-image:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # Catches Dockerfile breakage (bad ldflags, missing COPY) before deploy.
      - name: Build image
        run: |
          docker build \
            --build-arg BUILD_COMMIT="${GITHUB_SHA::7}" \
            -t ssh-portfolio:ci .

      - name: Smoke-test the container
        run: |
          docker run -d --name portfolio-ci \
            -e SSH_ENABLED=true -e PORT=8080 -e GITHUB_SYNC=false \
            -p 8080:8080 ssh-portfolio:ci

          # Wait for the health endpoint rather than sleeping a fixed amount.
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health > /tmp/health.json 2>/dev/null; then
              echo "Healthy after ${i}s:"; cat /tmp/health.json; echo
              # The endpoint must report ok — a 200 with a failure body is
              # still a failure.
              grep -q '"status":"ok"' /tmp/health.json \
                || { echo "::error::/health did not report ok"; exit 1; }
              exit 0
            fi
            sleep 1
          done

          echo "::error::container never became healthy"
          docker logs portfolio-ci
          exit 1

      - name: Container logs on failure
        if: failure()
        run: docker logs portfolio-ci || true
